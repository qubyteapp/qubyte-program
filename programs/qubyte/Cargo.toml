[package]
name = "qubyte"
version = "0.1.0"
description = "Qubyte: Falcon-512 authorised pump.fun launchpad"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "qubyte"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
test-sbf = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "solana-v3"] }
solana-falcon512 = "0.1.2"
solana-sha256-hasher = "3"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }

# Off-chain (tests, clients linking the crate) there is no sha256 syscall.
[target.'cfg(not(target_os = "solana"))'.dependencies]
solana-sha256-hasher = { version = "3", features = ["sha2"] }

[dev-dependencies]
mollusk-svm = "~0.10"
solana-account = "3"
solana-pubkey = "3"
solana-sdk-ids = "3"
pqcrypto-falcon = "0.4"
pqcrypto-traits = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
